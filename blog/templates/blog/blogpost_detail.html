<!-- templates/blogpost_detail.html -->
{% extends "blog/base.html" %}
{% block content %}
<div class="post-entry">
<h2>{{ blogpost.title }}</h2>
<p>Author: {{ blogpost.author }}</p>
<p>{{ blogpost.body }}</p>
</div>
<a href="{% url 'blog:blogpost_edit' blogpost.pk %}">+ Edit Blog Post</a>
<p><a href="{% url 'blog:blogpost_delete' blogpost.pk %}">+ Delete Blog Post</a></p>
{% endblock content %}
