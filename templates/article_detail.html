{% extends "base.html" %}
{% block content %}
<div class="article-entry">
<h2>{{ object.title }}</h2>
<p>by {{ object.author }} | {{ object.date }}</p>
<p>{{ object.body }}</p>
</div>
<div>
<p>{% if user == article.author %}<a href="{% url 'article_edit' article.pk %}">Edit</a>
<a href="{% url 'article_delete' article.pk %}">Delete</a>{% endif %}
</p>
<p>Back to <a href="{% url 'home' %}">All Articles</a>.</p>
</div>
{% endblock content %}
